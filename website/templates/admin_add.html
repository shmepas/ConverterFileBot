<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Добавить администратора</title>
  <style>
    body { background: #121212; color: #eee; font-family: Arial, sans-serif; padding: 20px; }
    form { max-width: 400px; margin-top: 30px; }
    label { display: block; margin-bottom: 10px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 8px; margin-bottom: 15px; border-radius: 5px; border: none; font-size: 1rem;
    }
    button {
      background: #2a9df4; border: none; color: white; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 700;
    }
    button:hover { background: #1a7cd6; }
    .error { color: #f44336; margin-bottom: 15px; }
    .success { color: #4caf50; margin-bottom: 15px; }
    a { color: #2a9df4; text-decoration: none; font-weight: 700; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Добавить администратора</h1>

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}
  {% if success %}
    <div class="success">{{ success }}</div>
  {% endif %}

  <form method="POST">
    {{ csrf_token() }}
    <label>
      Имя пользователя:
      <input type="text" name="username" required />
    </label>
    <label>
      Пароль:
      <input type="password" name="password" required />
    </label>
    <label>
      Подтверждение пароля:
      <input type="password" name="password_confirm" required />
    </label>
    <button type="submit">Добавить</button>
  </form>

  <br />
  <a href="{{ url_for('admin_list') }}">Назад к списку администраторов</a>
</body>
</html>
