<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Вход для админов</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    form {
      background: #222;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(42,157,244,0.6);
      width: 320px;
      box-sizing: border-box;
    }
    h2 {
      color: #2a9df4;
      margin-bottom: 20px;
      text-align: center;
      text-shadow: 0 0 8px #2a9df4;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #aaa;
      text-shadow: 0 0 3px rgba(0,0,0,0.7);
    }
    input {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: none;
      background: #333;
      color: #eee;
      font-size: 1rem;
      box-shadow: inset 0 0 8px #1a7cd6;
      transition: box-shadow 0.3s ease;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      box-shadow: inset 0 0 15px #2a9df4;
    }
    button {
      width: 100%;
      padding: 14px 0;
      background: linear-gradient(45deg, #2a9df4, #1a7cd6);
      border: none;
      border-radius: 50px;
      color: white;
      font-weight: 700;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(42,157,244,0.7);
      transition: background 0.3s ease, transform 0.2s ease;
    }
    button:hover {
      background: linear-gradient(45deg, #1a7cd6, #2a9df4);
      transform: scale(1.05);
      box-shadow: 0 8px 30px rgba(42,157,244,0.9);
    }
    .error {
      color: #f44336;
      font-weight: 700;
      margin-bottom: 15px;
      text-align: center;
    }
    a {
      color: #2a9df4;
      display: block;
      margin-top: 10px;
      text-align: center;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <form method="POST">
    <h2>Вход для админов</h2>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <label for="username">Логин</label>
    <input type="text" id="username" name="username" required autocomplete="username" />
    <label for="password">Пароль</label>
    <input type="password" id="password" name="password" required autocomplete="current-password" />
    <button type="submit">Войти</button>
    <a href="{{ url_for('index') }}">← На главную</a>
  </form>
</body>
</html>
