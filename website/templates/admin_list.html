<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Список администраторов</title>
  <style>
    body { background: #121212; color: #eee; font-family: Arial, sans-serif; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px;}
    th, td { padding: 12px; border-bottom: 1px solid #444; }
    button { background: #f44336; border: none; color: white; padding: 8px 12px; border-radius: 6px; cursor: pointer;}
    button:hover { background: #d32f2f; }
    a { color: #2a9df4; text-decoration: none; font-weight: 700; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Список администраторов</h1>
  <p>Текущий пользователь: {{ current_username }}</p>
  <a href="{{ url_for('admin_add') }}">Добавить администратора</a>
  <table>
    <thead>
      <tr><th>Имя пользователя</th><th>Действия</th></tr>
    </thead>
    <tbody>
      {% for admin in admins %}
      <tr>
        <td>{{ admin[1] }}</td>
        <td>
          {% if admin[1] != current_username %}
          <form method="POST" action="{{ url_for('admin_delete', admin_id=admin[0]) }}" onsubmit="return confirm('Удалить администратора {{ admin[1] }}?');">
            {{ csrf_token() }}
            <button type="submit">Удалить</button>
          </form>
          {% else %}
            <em>Это вы</em>
          {% endif %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  <br />
  <a href="{{ url_for('admin_panel') }}">Назад в панель администратора</a>
</body>
</html>
