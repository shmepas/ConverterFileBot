<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Панель администратора</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #eee;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    header {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }
    h1 {
      color: #2a9df4;
      text-shadow: 0 0 8px #2a9df4;
      margin: 0;
      font-size: 2.4rem;
    }
    a.logout {
      color: #f44336;
      font-weight: 700;
      text-decoration: none;
      font-size: 1.1rem;
    }
    main {
      max-width: 800px;
      width: 100%;
      background: #222;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(42,157,244,0.3);
      font-size: 1.2rem;
    }
    nav {
      margin-top: 30px;
      max-width: 800px;
      width: 100%;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    nav a {
      padding: 10px 18px;
      background: #2a9df4;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 700;
      transition: background 0.3s ease;
    }
    nav a:hover {
      background: #1a7cd6;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      color: #eee;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #444;
      text-align: left;
    }
    th {
      background: #1a7cd6;
    }
    button {
      background: #f44336;
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 700;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #d32f2f;
    }
  </style>
</head>
<body>
  <header>
    <h1>Админка — {{ username }}</h1>
    <a class="logout" href="{{ url_for('admin_logout') }}">Выйти</a>
  </header>

  <nav>
    <a href="{{ url_for('admin_list') }}">Управление администраторами</a>
    <a href="{{ url_for('admin_messages') }}">Сообщения пользователей</a>
    <a href="{{ url_for('admin_stats') }}">Статистика бота</a>
  </nav>

  <main>
    <h2>Управление администраторами</h2>
    <table>
      <thead>
        <tr>
          <th>Имя пользователя</th>
          <th>Email</th>
          <th>Роль</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody>
        {% for admin in admins %}
        <tr>
          <td>{{ admin.username }}</td>
          <td>{{ admin.email }}</td>
          <td>{{ admin.role }}</td>
          <td>
            <form method="POST" action="{{ url_for('admin_delete', admin_id=admin.id) }}" onsubmit="return confirm('Удалить администратора?');">
              <button type="submit">Удалить</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    <h3>Добавить администратора</h3>
    <form method="POST" action="{{ url_for('admin_add') }}">
      <label>
        Имя пользователя:<br />
        <input type="text" name="username" required />
      </label><br /><br />
      <label>
        Email:<br />
        <input type="email" name="email" required />
      </label><br /><br />
      <label>
        Роль:<br />
        <select name="role">
          <option value="admin">Администратор</option>
          <option value="superadmin">Супер администратор</option>
        </select>
      </label><br /><br />
      <label>
        Пароль:<br />
        <input type="password" name="password" required />
      </label><br /><br />
      <button type="submit">Добавить</button>
    </form>
  </main>
</body>
</html>
